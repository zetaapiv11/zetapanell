# Render Blueprint Specification for ZetaPanel
version: "1"

databases:
  - name: zetapanel-db
    databaseName: zetapanel
    user: zetapanel_user
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: zetapanel-control-plane
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run serve:ssr:app
    healthCheckPath: /api/v1/health
    autoDeploy: true

    disk:
      name: zetapanel-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        fromDatabase:
          name: zetapanel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: zetapanel-servers
      - key: APP_URL
        sync: false

      # ZIP runtime bridge
      - key: ZETAPANEL_RUNTIME_REPO
        value: https://github.com/zetaapiv11/zetapanell
      - key: ZETAPANEL_RUNTIME_BRANCH
        value: main

      # WhatsApp
      - key: ADMIN_WHATSAPP_NUMBER
        value: "6283195426349"
